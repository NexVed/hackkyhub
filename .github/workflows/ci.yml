name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_call:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-ops.txt httpx pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app scripts
      - run: pip-audit
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.13.5' }
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform/aws init -backend=false
      - run: terraform -chdir=infra/terraform/aws validate
      - run: kubectl kustomize infra/k8s/overlays/staging > /tmp/staging.yaml
      - run: kubectl kustomize infra/k8s/overlays/production > /tmp/production.yaml
      - run: docker compose config --no-env-resolution > /tmp/compose.yaml
        env: { NEXT_PUBLIC_CONVEX_URL: 'https://ci-placeholder.convex.cloud' }
