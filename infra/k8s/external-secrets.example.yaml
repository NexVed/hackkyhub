# Apply once per application namespace after installing External Secrets.
# Edit the namespace, AWS region, IAM role and remote keys for each environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-secrets
  namespace: hackkyhub-staging
  annotations: { eks.amazonaws.com/role-arn: REPLACE_SECRETS_READER_ROLE_ARN }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: aws-runtime, namespace: hackkyhub-staging }
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth: { jwt: { serviceAccountRef: { name: runtime-secrets } } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: frontend-runtime, namespace: hackkyhub-staging }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-runtime, kind: SecretStore }
  target: { name: frontend-runtime, creationPolicy: Owner }
  dataFrom: [{ extract: { key: hackkyhub/staging/frontend } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: scraper-runtime, namespace: hackkyhub-staging }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-runtime, kind: SecretStore }
  target: { name: scraper-runtime, creationPolicy: Owner }
  dataFrom: [{ extract: { key: hackkyhub/staging/scraper } }]
